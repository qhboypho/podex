<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Lịch sử đơn đã in</title>
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <header>
    <h1>Lịch sử đơn đã in</h1>
    <div class="sub" id="stats">Đang tải...</div>
  </header>
  <div class="controls">
    <input id="q" type="search" placeholder="Tìm theo mã vận đơn, tên file, sàn... (tìm trên toàn bộ lịch sử)">
    <select id="range" title="Khoảng thời gian">
      <option value="today" selected>Hôm nay</option>
      <option value="7">7 ngày qua</option>
      <option value="30">30 ngày qua</option>
      <option value="all">Tất cả</option>
      <option value="day">Theo ngày...</option>
    </select>
    <input id="dayPick" type="date" class="hidden" title="Xem file của một ngày">
    <button id="addPdf" title="Thêm file PDF bất kỳ vào lịch sử">+ Thêm PDF</button>
    <button id="refresh" title="Làm mới danh sách">Làm mới</button>
    <button id="exportBtn" title="Lưu toàn bộ lịch sử ra file backup .json">Xuất backup</button>
    <button id="importBtn" title="Khôi phục lịch sử từ file backup">Nhập backup</button>
    <button id="clearAll" class="danger" title="Xoá toàn bộ lịch sử đã lưu">Xoá tất cả</button>
  </div>
  <input type="file" id="importInput" accept=".json,application/json" hidden>
  <main id="list"></main>
  <div id="pageError" class="hidden"></div>
  <div id="empty" class="hidden">
    <p><b>Chưa có đơn nào được lưu.</b></p>
    <p>Bấm <b>In đơn</b> trên sàn như bình thường — extension sẽ tự lưu bản PDF lại đây
    (mặc định giữ 30 ngày rồi tự xoá). Đơn in trước khi cập nhật extension sẽ không có
    trong lịch sử; nếu còn file PDF, bấm <b>+ Thêm PDF</b> ở trên để đưa vào.</p>
  </div>
  <input type="file" id="pdfInput" accept="application/pdf" hidden>
  <div id="toast" class="hidden"></div>
  <script src="../archive.js"></script>
  <script src="history.js"></script>
</body>
</html>
